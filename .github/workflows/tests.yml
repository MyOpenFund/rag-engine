name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# For every job: the ONNX runtime sends telemetry unless this is 1 when it is imported, and a
# test module may import it (through qdrant-client and fastembed) before the engine sets its default.
env:
  ORT_DISABLE_TELEMETRY: "1"
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The ingest extra (document parsers) is installed on 3.12 and on 3.13, the version
      # production runs on and the golden fixture was captured with: the tests that need the
      # real libraries run there. 3.10 keeps the light install, where they skip.
      - run: pip install -e ".[dev${{ matrix.python-version != '3.10' && ',ingest' || '' }}]"
      - name: Check that the document parsers are importable
        if: matrix.python-version != '3.10'
        run: python -c "import chunknorris.chunkers, chunknorris.parsers, markitdown, pptx, pymupdf"
      # Tesseract is not on the GitHub runner image. With it, the test that reads a scanned PDF
      # with ocr="always" runs instead of skipping; it needs the parsers.
      - name: Install Tesseract for the OCR test
        if: matrix.python-version != '3.10'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --list-langs 2>&1 | grep -x eng
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    env:
      RAG_ENGINE_IT_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The ingest extra: the ingestion tests parse real documents and skip without it.
      - run: pip install -e ".[dev,ingest]"
      - name: Check that the document parsers are importable
        run: python -c "import chunknorris.chunkers, chunknorris.parsers, markitdown, pptx, pymupdf"
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - run: python -m pytest -m integration -q
  # The real embedding model, through both backends: the test of the torch backend, and the
  # parity test that allows queries embedded with onnx against passages embedded with torch.
  parity:
    runs-on: ubuntu-latest
    # About 3 minutes with the model cache, about 10 without. The limit stops a download that
    # hangs long before the 6 hours GitHub allows a job.
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.model-cache/huggingface
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model-cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The CPU build of PyTorch first: the default wheel carries the CUDA libraries.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,torch,onnx]"
      - name: Check that both backends are importable
        run: python -c "import fastembed, onnxruntime, sentence_transformers, torch; print(torch.__version__)"
      # The cache key carries the revision the engine pins for the ONNX file: when the table
      # ONNX_MODELS changes, the cache starts empty and the new file is really downloaded.
      - name: Read the pinned revision of the ONNX model
        id: pin
        run: |
          python -c "from rag_engine.embedding import ONNX_MODELS; print('revision=' + ONNX_MODELS['intfloat/multilingual-e5-base'].revision)" >> "$GITHUB_OUTPUT"
      # About 2.2 GB: the weights for sentence-transformers and the ONNX file for fastembed.
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-intfloat-multilingual-e5-base-${{ steps.pin.outputs.revision }}
      # The import guarantee is checked here too: this is the only job where torch and
      # fastembed are both installed, the install in which a stray import would show.
      - run: python -m pytest tests/test_packaging.py -q
      - run: python -m pytest -m models -q -s
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build . --outdir dist
          twine check --strict dist/*
      - name: Smoke install in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "$(ls "$PWD"/dist/*.whl)[onnx]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "import rag_engine; print(rag_engine.__file__)"
          "$RUNNER_TEMP/smoke/bin/python" -c "from rag_engine.embedding import ONNX_MODELS; assert len(ONNX_MODELS) >= 1"
          expected="$("$RUNNER_TEMP/smoke/bin/python" -c "import importlib.metadata as m; print(m.version('myopenfund-rag-engine'))")"
          shown="$("$RUNNER_TEMP/smoke/bin/rag-engine" --version)"
          if [ "$shown" != "rag-engine $expected" ]; then
            echo "rag-engine --version printed '$shown' but the wheel is $expected"
            exit 1
          fi
