name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The ingest extra (document parsers) is installed on one version only: the tests that
      # need the real libraries run there and skip elsewhere.
      - run: pip install -e ".[dev${{ matrix.python-version == '3.12' && ',ingest' || '' }}]"
      - name: Check that the document parsers are importable
        if: matrix.python-version == '3.12'
        run: python -c "import chunknorris.chunkers, chunknorris.parsers, markitdown, pptx, pymupdf"
      # Tesseract is not on the GitHub runner image. With it, the test that reads a scanned PDF
      # with ocr="always" runs instead of skipping; it needs the parsers, so one version only.
      - name: Install Tesseract for the OCR test
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --list-langs 2>&1 | grep -x eng
      - run: ruff check .
      - run: python -m pytest -q
  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    env:
      RAG_ENGINE_IT_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The ingest extra: the ingestion tests parse real documents and skip without it.
      - run: pip install -e ".[dev,ingest]"
      - name: Check that the document parsers are importable
        run: python -c "import chunknorris.chunkers, chunknorris.parsers, markitdown, pptx, pymupdf"
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - run: python -m pytest -m integration -q
