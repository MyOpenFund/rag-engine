[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "myopenfund-rag-engine"
dynamic = ["version"]
description = "Ingest one document into Qdrant with deterministic point ids, search what was ingested, and measure the search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Marc Jeulin" }]
maintainers = [{ name = "Marc Jeulin" }]
keywords = ["myopenfund", "rag", "qdrant", "embeddings", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# qdrant-client 1.10.0 is the first release with QdrantClient.query_points (the query API), which
# the search uses. The store also needs collection_exists (1.8.0) to tell "the collection is
# absent" from a failure.
dependencies = ["qdrant-client>=1.10", "numpy"]

[project.optional-dependencies]
# fastembed is bounded to the minor version the parity test passed on (0.9.1). The onnx backend
# embeds queries for passages embedded with sentence-transformers: a fastembed release that
# tokenises, pools or loads the model differently would move the query vectors away from the
# stored ones without any error. The backend also relies on what 0.9 offers: the
# specific_model_path and providers options. Raise the upper bound only after the parity test
# (pytest -m models) has passed on the new version.
# huggingface_hub is imported by the backend itself (snapshot_download fetches the pinned model
# files), so it is declared here and not left to arrive through fastembed. 0.20 is the lower
# bound fastembed 0.9 declares; the arguments the backend uses (revision, allow_patterns,
# cache_dir, local_files_only) all exist in 0.20.0. No upper bound: the files it fetches are
# verified by their SHA-256 whatever version fetched them (fastembed 0.9 itself asks for <2).
onnx = ["fastembed>=0.9,<0.10", "huggingface_hub>=0.20"]
# sentence-transformers is bounded to the major version parity was measured on (6.3.0): the
# passages of a collection are embedded with it, and a release that loads, tokenises, pools or
# normalises the model differently would write vectors that no longer match the stored ones,
# nor the queries of the onnx backend, without any error. The bound admits 6.0.0 to 6.3.0 and
# the later 6.x releases; it leaves out 5.x and older (5.7.0 was the last, of August 2026) and
# 7.x. Raise the upper bound only after the tests of the real model and the parity test
# (pytest -m models) have passed on the new version.
torch = ["sentence-transformers>=6,<7"]
# chunknorris is bounded because a release that cuts documents differently would silently mix
# two cuts. Point ids come from doc_id, page and chunk index, not from the text: on
# re-ingestion, the points with the same (page, index) are overwritten with other text and
# vectors, and the surplus (page, index) pairs of the old cut stay behind as stale points. A
# change of chunking therefore requires a clean re-ingestion of the document set.
# 1.3.7 and 1.5.0 were compared and gave identical chunks. Before raising the upper bound,
# compare the chunks of the new minor version with those of 1.5.0 on real documents.
# psutil: imported by chunknorris (1.5.0) without being declared in its dependencies.
ingest = ["chunknorris>=1.3.7,<1.6", "markitdown[pptx]", "psutil"]
# The local index (rag_engine.local): Qdrant's local mode and SQLite FTS5 on the user's disk, no
# server. It embeds with the onnx backend and parses documents with the ingest extra.
local = ["myopenfund-rag-engine[onnx,ingest]"]
# ruff is bounded: CI runs "ruff format --check", and a new ruff release may change its style.
dev = ["pytest>=8.3", "ruff>=0.17,<0.18", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/MyOpenFund/rag-engine"
Source = "https://github.com/MyOpenFund/rag-engine"
Issues = "https://github.com/MyOpenFund/rag-engine/issues"
Organization = "https://github.com/MyOpenFund"
Changelog = "https://github.com/MyOpenFund/rag-engine/blob/main/CHANGELOG.md"

[project.scripts]
rag-engine = "rag_engine.cli:main"

[tool.hatch.version]
path = "src/rag_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

# The source distribution keeps the tests and eval/ (the evaluation fixture the tests read, the
# question files and the script that builds them); the capture tool and the CI files stay in
# the repository. The wheel holds the package only.
[tool.hatch.build.targets.sdist]
exclude = ["/tools", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real Qdrant (RAG_ENGINE_IT_QDRANT_URL)",
  "models: downloads embedding models",
]
addopts = "-m 'not integration and not models'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# The defaults of ruff, plus the line length (the formatter does not shorten strings and comments).
extend-select = ["E501"]
