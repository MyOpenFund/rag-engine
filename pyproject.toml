[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-engine"
version = "0.1.0"
description = "Ingest one document into Qdrant with deterministic point ids, and search what was ingested."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Marc Jeulin" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
# qdrant-client 1.10.0 is the first release with QdrantClient.query_points (the query API), which
# the search uses. The store also needs collection_exists (1.8.0) to tell "the collection is
# absent" from a failure.
dependencies = ["qdrant-client>=1.10", "numpy"]

[project.optional-dependencies]
# fastembed is bounded to the minor version the parity test passed on (0.9.1). The onnx backend
# embeds queries for passages embedded with sentence-transformers: a fastembed release that
# tokenises, pools or loads the model differently would move the query vectors away from the
# stored ones without any error. The backend also relies on what 0.9 offers: the
# specific_model_path and providers options, and huggingface_hub as a dependency (it downloads
# the pinned model files). Raise the upper bound only after the parity test
# (pytest -m models) has passed on the new version.
onnx = ["fastembed>=0.9,<0.10"]
torch = ["sentence-transformers"]
# chunknorris is bounded because a release that cuts documents differently would silently mix
# two cuts. Point ids come from doc_id, page and chunk index, not from the text: on
# re-ingestion, the points with the same (page, index) are overwritten with other text and
# vectors, and the surplus (page, index) pairs of the old cut stay behind as stale points. A
# change of chunking therefore requires a clean re-ingestion of the document set.
# 1.3.7 and 1.5.0 were compared and gave identical chunks. Before raising the upper bound,
# compare the chunks of the new minor version with those of 1.5.0 on real documents.
# psutil: imported by chunknorris (1.5.0) without being declared in its dependencies.
ingest = ["chunknorris>=1.3.7,<1.6", "markitdown[pptx]", "psutil"]
# ruff is bounded: CI runs "ruff format --check", and a new ruff release may change its style.
dev = ["pytest>=8.3", "ruff>=0.17,<0.18"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

# The source distribution keeps the tests; the capture tool and the CI files stay in the repository.
[tool.hatch.build.targets.sdist]
exclude = ["/tools", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real Qdrant (RAG_ENGINE_IT_QDRANT_URL)",
  "models: downloads embedding models",
]
addopts = "-m 'not integration and not models'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# The defaults of ruff, plus the line length (the formatter does not shorten strings and comments).
extend-select = ["E501"]
