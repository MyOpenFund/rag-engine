[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-engine"
version = "0.1.0"
description = "Ingest one document into Qdrant and search what was ingested."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Marc Jeulin" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
# qdrant-client 1.8.0 is the first release with QdrantClient.collection_exists, which the store
# uses to tell "the collection is absent" from a failure.
dependencies = ["qdrant-client>=1.8", "numpy"]

[project.optional-dependencies]
onnx = ["fastembed"]
torch = ["sentence-transformers"]
# chunknorris is bounded because the text of a chunk determines the id of its point: a release
# that cuts documents differently would, on re-ingestion, write new points and leave the old
# ones behind. 1.3.7 and 1.5.0 were compared and gave identical chunks. Before raising the
# upper bound, compare the chunks of the new minor version with those of 1.5.0 on real documents.
# psutil: imported by chunknorris (1.5.0) without being declared in its dependencies.
ingest = ["chunknorris>=1.3.7,<1.6", "markitdown[pptx]", "psutil"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

# The source distribution keeps the tests; the capture tool and the CI files stay in the repository.
[tool.hatch.build.targets.sdist]
exclude = ["/tools", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a real Qdrant (RAG_ENGINE_IT_QDRANT_URL)",
  "models: downloads embedding models",
]
addopts = "-m 'not integration and not models'"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# The defaults of ruff, plus the line length (the formatter does not shorten strings and comments).
extend-select = ["E501"]
